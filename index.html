<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Evolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #1a1a2e;
            font-family: 'Source Code Pro', monospace;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #0f3460;
        }
        
        canvas { 
            display: block;
            background: linear-gradient(to bottom, #87ceeb, #98d8f0);
            border-radius: 0px;
        }

        #scoreDisplay {
            position: absolute;
            top: 15px;
            left: 25px;
            font-family: 'Bungee', cursive;
            font-size: 48px;
            color: #fff;
            text-shadow: 3px 3px 0px #000, 6px 6px 10px rgba(0,0,0,0.7);
            font-weight: bold;
        }

        #levelDisplay {
            position: absolute;
            top: 25px;
            right: 25px;
            font-family: 'Bungee', cursive;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 2px 2px 0px #000, 4px 4px 8px rgba(0,0,0,0.6);
        }
        
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            background: radial-gradient(circle, rgba(20, 30, 70, 0.9), rgba(10, 15, 40, 0.98));
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            border: 2px solid #a6d8f0;
            box-shadow: 0 0 25px rgba(166, 216, 240, 0.5);
            animation: fadeIn 0.5s ease-out;
            width: 600px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .overlay h2 {
            margin-top: 0;
            font-size: 3.5em;
            font-family: 'Bungee', cursive;
            color: #ff4757;
            text-shadow: 0 0 10px #ff4757, 0 0 20px #ff4757;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 1.1em;
            line-height: 1.7;
            text-shadow: 1px 1px 2px #000;
        }

        .overlay kbd {
            background-color: #2a2a4a;
            border-radius: 5px;
            border: 1px solid #a6d8f0;
            color: #e0fbfc;
            display: inline-block;
            font-size: 0.9em;
            font-weight: 700;
            line-height: 1;
            padding: 6px 10px;
            box-shadow: 0 2px 0 #a6d8f0;
            margin: 2px;
        }
        
        .restart-btn {
            font-family: 'Bungee', cursive;
            background: linear-gradient(to bottom, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            border-bottom: 3px solid #c0392b;
        }
        
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        .restart-btn:active { transform: translateY(1px); }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1800" height="900"></canvas>
        <div id="scoreDisplay">0</div>
        <div id="levelDisplay">Level 1</div>
        <div id="instructionsText" class="instructions">ESPAÇO para pular</div>
        
        <div class="overlay" id="startScreen" style="display: block;">
            <h2>Flappy Bird<br>Evolution</h2>
            <p>Pressione <kbd>ESPAÇO</kbd> para começar!</p>
            <p class="instructions" style="position: static; margin-top: 20px; font-size: 14px; text-align: left; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px;">
                <b>Flappy Mode:</b> <kbd>ESPAÇO</kbd> para pular.<br><br>
                <b>Boss Mode:</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> para mover e <kbd>ESPAÇO</kbd> para atirar.
            </p>
        </div>

        <div class="overlay" id="bossWarningScreen">
            <h2>AVISO DE CHEFE!</h2>
            <p>Prepare-se para a batalha!</p>
            <p>Pressione <kbd>ESPAÇO</kbd> para começar!</p>
        </div>
        
        <div class="overlay" id="gameOverScreen">
            <h2>Game Over!</h2>
            <p>Pontuação Final: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const bossWarningScreen = document.getElementById('bossWarningScreen');
        const startScreen = document.getElementById('startScreen');
        const instructionsText = document.getElementById('instructionsText');

        let gameState = 'startScreen';
        let score = 0, level = 1, pipeSpeed = 14, frames = 0;
        let pipes = [], bossProjectiles = [], playerProjectiles = [], boss = null, bossHealth = 0;
        let boss50Defeated = false; // *** VARIÁVEL DE CONTROLE PARA O CHEFE ***
        const keys = { w: false, a: false, s: false, d: false, space: false };
        
        const bird = { 
            x: 150, y: canvas.height / 2, width: 50, height: 35, 
            velocity: 0, gravity: 0.65, jumpPower: -11, terminalVelocity: 15, 
            moveSpeed: 8, rotation: 0, wingPosition: 0, 
            color: '#FFD700', wingColor: '#FFA500', eyeColor: '#000', beakColor: '#FF6B35', 
            shootCooldown: 0 
        };

        function drawBird() {
            ctx.save(); ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2); ctx.rotate(bird.rotation);
            ctx.fillStyle = bird.color; ctx.beginPath(); ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = bird.wingColor; ctx.beginPath(); ctx.ellipse(-10, Math.sin(bird.wingPosition) * 5, 15, 8, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = bird.eyeColor; ctx.beginPath(); ctx.arc(15, -5, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = bird.beakColor; ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(30, -5); ctx.lineTo(30, 5); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                const topGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipe.width, 0); topGradient.addColorStop(0, '#228B22'); topGradient.addColorStop(1, '#32CD32');
                ctx.fillStyle = topGradient; ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillStyle = '#006400'; ctx.fillRect(pipe.x - 5, pipe.top - 15, pipe.width + 10, 15);
                const bottomGradient = ctx.createLinearGradient(pipe.x, canvas.height - pipe.bottom, pipe.x + pipe.width, canvas.height - pipe.bottom); bottomGradient.addColorStop(0, '#228B22'); bottomGradient.addColorStop(1, '#32CD32');
                ctx.fillStyle = bottomGradient; ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
                ctx.fillStyle = '#006400'; ctx.fillRect(pipe.x - 5, canvas.height - pipe.bottom, pipe.width + 10, 15);
            });
        }
        
        function drawProjectiles(projectileList) {
            projectileList.forEach(proj => {
                ctx.fillStyle = proj.color; ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.size, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.size + 3, 0, Math.PI * 2); ctx.fill();
            });
        }
        
        function drawBoss() {
            if (!boss) return;
            ctx.fillStyle = boss.color; ctx.beginPath(); ctx.arc(boss.x + boss.width / 2, boss.y + boss.height / 2, boss.width / 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(boss.x + boss.width / 3, boss.y + boss.height / 3, 8, 0, Math.PI * 2); ctx.arc(boss.x + 2 * boss.width / 3, boss.y + boss.height / 3, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(boss.x + boss.width / 3, boss.y + boss.height / 3, 4, 0, Math.PI * 2); ctx.arc(boss.x + 2 * boss.width / 3, boss.y + boss.height / 3, 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#333'; ctx.fillRect(boss.x - 10, boss.y - 30, boss.width + 20, 15);
            ctx.fillStyle = '#FF0000'; ctx.fillRect(boss.x - 10, boss.y - 30, (boss.width + 20) * (bossHealth / boss.maxHealth), 15);
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height); gradient.addColorStop(0, '#87CEEB'); gradient.addColorStop(1, '#98FB98');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8B4513'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#228B22'; ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
        }

        function drawUI() { scoreDisplay.textContent = score; levelDisplay.textContent = `Level ${level}`; }
        
        function updateBird() {
            if (gameState === 'playing') {
                bird.velocity += bird.gravity;
                if (bird.velocity > bird.terminalVelocity) bird.velocity = bird.terminalVelocity;
                bird.y += bird.velocity;
                bird.rotation = Math.min(Math.PI / 2, bird.velocity * 0.06); 
                if (bird.y < 0) { bird.y = 0; bird.velocity = 0; }
                if (bird.y + bird.height > canvas.height - 40) gameOver();
            } else if (gameState === 'boss50' || gameState === 'boss100') {
                bird.rotation = 0; bird.velocity = 0;
                if (keys.w) bird.y -= bird.moveSpeed; if (keys.s) bird.y += bird.moveSpeed;
                if (keys.a) bird.x -= bird.moveSpeed; if (keys.d) bird.x += bird.moveSpeed;
                bird.x = Math.max(0, Math.min(canvas.width - bird.width, bird.x));
                bird.y = Math.max(0, Math.min(canvas.height - 40 - bird.height, bird.y));
                if(keys.space) shoot();
            }
            bird.wingPosition += 0.25; if (bird.shootCooldown > 0) bird.shootCooldown--;
        }

        function jump() { 
            if (gameState === 'playing') {
                bird.velocity = bird.jumpPower;
                bird.rotation = -Math.PI / 3;
            }
        }
        
        function shoot() {
            if ((gameState === 'boss50' || gameState === 'boss100') && bird.shootCooldown === 0) {
                playerProjectiles.push({ x: bird.x + bird.width, y: bird.y + bird.height / 2, size: 8, color: '#FFFF00' });
                bird.shootCooldown = 8;
            }
        }

        function createPipe() {
            const gap = 220; const minHeight = 80;
            const top = Math.random() * (canvas.height - gap - 2 * minHeight - 40) + minHeight;
            pipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - gap - 40, width: 80, passed: false });
        }

        function updatePipes() {
            if (frames % 90 === 0) createPipe();
            for (let i = pipes.length - 1; i >= 0; i--) {
                let pipe = pipes[i]; pipe.x -= pipeSpeed;
                if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                    score++; level = Math.floor(score / 10) + 1; pipe.passed = true; updateSpeed();
                }
                if (pipe.x + pipe.width < 0) pipes.splice(i, 1);
                if (bird.x < pipe.x + pipe.width && bird.x + bird.width > pipe.x && (bird.y < pipe.top || bird.y + bird.height > canvas.height - pipe.bottom)) gameOver();
            }
            // *** LÓGICA DE CHAMADA DO CHEFE CORRIGIDA ***
            if (score >= 50 && gameState === 'playing' && !boss50Defeated) showBossWarning();
            else if (score >= 100 && gameState === 'playing') showBossWarning();
        }

        // *** AUMENTO DE VELOCIDADE AJUSTADO ***
        function updateSpeed() { if (score % 10 === 0 && score > 0) pipeSpeed += 0.25; }

        function showBossWarning() {
            gameState = 'preBossWarning';
            instructionsText.innerHTML = `W, A, S, D para mover • ESPAÇO para atirar`;
            bossWarningScreen.style.display = 'block';
        }

        function startBossFight() {
            if (gameState !== 'preBossWarning') return;
            bossWarningScreen.style.display = 'none';
            if (score >= 100) enterBoss100(); else if (score >= 50) enterBoss50();
        }

        function enterBoss50() {
            gameState = 'boss50'; pipes = [];
            boss = { x: canvas.width - 200, y: canvas.height / 2 - 60, width: 120, height: 120, color: '#DC143C', maxHealth: 40, shootRate: 15 };
            bossHealth = boss.maxHealth;
        }

        function enterBoss100() {
            gameState = 'boss100'; pipes = [];
            boss = { x: canvas.width - 250, y: canvas.height / 2 - 75, width: 150, height: 150, color: '#4B0082', maxHealth: 80, shootRate: 25, specialAttackTimer: 180 };
            bossHealth = boss.maxHealth;
        }

        function updateBossAndProjectiles() {
            if (!boss) return;
            boss.y += Math.sin(frames * 0.05) * 2.5;

            if (gameState === 'boss50' && frames % boss.shootRate === 0) {
                const angle = Math.atan2((bird.y + bird.height / 2) - (boss.y + boss.height / 2), (bird.x + bird.width / 2) - boss.x);
                bossProjectiles.push({ x: boss.x, y: boss.y + boss.height / 2, size: 12, color: '#FF1493', vx: Math.cos(angle) * 12, vy: Math.sin(angle) * 12, homing: false });
            }
            
            if (gameState === 'boss100') {
                if (frames % boss.shootRate === 0) {
                    bossProjectiles.push({ x: boss.x, y: boss.y + boss.height / 2, size: 10, color: '#FF1493', speed: 6, homing: true });
                }
                boss.specialAttackTimer--;
                if (boss.specialAttackTimer <= 0) {
                    bossProjectiles.push({ x: boss.x, y: boss.y + boss.height / 2, size: 15, color: '#32CD32', speed: 9, homing: true, homingDuration: 180 });
                    boss.specialAttackTimer = 240;
                }
            }
            
            bossProjectiles.forEach(proj => {
                if (proj.homing) {
                    const angle = Math.atan2((bird.y + bird.height / 2) - proj.y, (bird.x + bird.width / 2) - proj.x);
                    proj.vx = Math.cos(angle) * proj.speed; proj.vy = Math.sin(angle) * proj.speed;
                    if (proj.homingDuration) { proj.homingDuration--; if (proj.homingDuration <= 0) proj.homing = false; }
                }
                proj.x += proj.vx; proj.y += proj.vy;
                if (Math.hypot(proj.x - (bird.x + bird.width/2), proj.y - (bird.y + bird.height/2)) < proj.size + bird.width/2 - 5) gameOver();
            });

            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                let proj = playerProjectiles[i]; proj.x += 18;
                if (proj.x > canvas.width) { playerProjectiles.splice(i, 1); continue; }
                if (Math.hypot(proj.x - (boss.x + boss.width/2), proj.y - (boss.y + boss.height/2)) < proj.size + boss.width/2) {
                    bossHealth--; playerProjectiles.splice(i, 1);
                    if (bossHealth <= 0) bossDefeated();
                }
            }
        }
        
        // *** LÓGICA DE DERROTAR O CHEFE CORRIGIDA ***
        function bossDefeated() {
            let defeatedBossState = gameState;
            boss = null; bossProjectiles = []; playerProjectiles = [];
            gameState = 'playing';
            instructionsText.innerHTML = `ESPAÇO para pular`;
            if (defeatedBossState === 'boss50') {
                score = 50; 
                boss50Defeated = true; // Marca o chefe como derrotado
                createPipe();
            } 
            else if (defeatedBossState === 'boss100') showGameOver(true);
        }

        function gameLoop() {
            if (gameState === 'gameOver' || gameState === 'win') return;
            ctx.clearRect(0, 0, canvas.width, canvas.height); drawBackground();

            if (gameState === 'startScreen') { drawBird(); drawUI(); } 
            else if (gameState === 'playing') { updateBird(); updatePipes(); } 
            else if (gameState === 'boss50' || gameState === 'boss100') { updateBird(); updateBossAndProjectiles(); } 
            else if (gameState === 'preBossWarning') { drawPipes(); drawBird(); }

            drawPipes(); drawBoss(); drawProjectiles(bossProjectiles); drawProjectiles(playerProjectiles);
            drawBird(); drawUI();
            
            frames++; requestAnimationFrame(gameLoop);
        }

        function startGame() {
            if (gameState !== 'startScreen') return;
            gameState = 'playing'; createPipe();
        }

        function gameOver() { if (gameState === 'gameOver' || gameState === 'win') return; showGameOver(false); }

        function showGameOver(isWin) {
            gameState = isWin ? 'win' : 'gameOver'; finalScore.textContent = score;
            gameOverScreen.style.display = 'block';
            gameOverScreen.querySelector('h2').textContent = isWin ? 'VOCÊ VENCEU!' : 'Game Over!';
        }

        function restartGame() {
            bird.x = 150; bird.y = canvas.height / 2; bird.velocity = 0; bird.rotation = 0;
            score = 0; level = 1; pipeSpeed = 14; pipes = [];
            bossProjectiles = []; playerProjectiles = []; boss = null;
            boss50Defeated = false; // *** RESETA O ESTADO DO CHEFE ***
            gameState = 'playing'; frames = 0;
            gameOverScreen.style.display = 'none'; bossWarningScreen.style.display = 'none';
            instructionsText.innerHTML = `ESPAÇO para pular`;
            createPipe(); gameLoop();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); keys.space = true;
                if (gameState === 'startScreen') { startScreen.style.display = 'none'; startGame(); }
                else if (gameState === 'playing') jump();
                else if (gameState === 'preBossWarning') startBossFight();
            }
            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyD') keys.d = true;
        });
        
        document.addEventListener('keyup', (e) => {
             if (e.code === 'Space') keys.space = false;
             if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyA') keys.a = false;
             if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyD') keys.d = false;
        });
        
        gameLoop();
    </script>
</body>
</html>
